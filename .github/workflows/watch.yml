name: FLATON空席監視

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "テスト通知だけ送る"
        type: boolean
        default: false

concurrency:
  group: flaton-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: flaton-state-${{ github.run_id }}
          restore-keys: flaton-state-
      - run: python check.py
        env:
          TARGET_DATES: ${{ vars.TARGET_DATES }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('state.json') != ''
        with:
          path: state.json
          key: flaton-state-${{ github.run_id }}
